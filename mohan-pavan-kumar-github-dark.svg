      <text x="34" y="431" font-size="12.2" fill="#94A3B8" opacity="0">
        Django · Bootstrap · JavaScript · PostgreSQL
        <animate attributeName="opacity" to="1" begin="4.2s" dur=".4s" fill="freeze"/>
      </text>

      <!-- certification -->
      <text x="34" y="466" font-size="14" fill="#F8FAFC" opacity="0">

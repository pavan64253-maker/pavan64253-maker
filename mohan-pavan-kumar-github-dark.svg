    <circle cx="24" cy="20" r="6" fill="#FF5F56"/>
    <circle cx="46" cy="20" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="20" r="6" fill="#27C93F"/>
    <text x="342" y="25" text-anchor="middle"
      font-family="Consolas,monospace" font-size="12" fill="#94A3B8">
      mohan@portfolio: ~
    </text>

    <g font-family="Consolas,Menlo,monospace">
      <text x="34" y="84" font-size="21" fill="#F8FAFC" opacity="0">
        Hi 👋
        <animate attributeName="opacity" to="1" begin=".2s" dur=".45s" fill="freeze"/>
      </text>
      <text x="34" y="122" font-size="28" font-weight="bold"
        fill="url(#accentGrad)" opacity="0">
        I'm Mohan Pavan Kumar
        <animate attributeName="opacity" to="1" begin=".55s" dur=".5s" fill="freeze"/>
      </text>

      <!-- animated roles -->
      <g font-size="17" fill="#22D3EE">
        <text x="34" y="154" opacity="0">&gt; Python Full Stack Developer_
          <animate attributeName="opacity" values="0;1;1;0;0"
            keyTimes="0;.04;.27;.32;1" dur="8s" begin="1s" repeatCount="indefinite"/>
        </text>
        <text x="34" y="154" opacity="0">&gt; Backend Developer_
          <animate attributeName="opacity" values="0;0;0;1;1;0"
            keyTimes="0;.27;.32;.36;.52;.57" dur="8s" begin="1s" repeatCount="indefinite"/>
        </text>
        <text x="34" y="154" opacity="0">&gt; Generative AI Enthusiast_

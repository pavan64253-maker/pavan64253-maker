            keyTimes="0;.48;.53;.58;.67;.72;.94;1" dur="8s" begin="1s" repeatCount="indefinite"/>
        </text>
      </g>

      <!-- sequential profile facts -->
      <g font-size="13.2" fill="#94A3B8">
        <text x="34" y="194" opacity="0">🎓 Education: B.Tech CSE · 2022–2026
          <animate attributeName="opacity" to="1" begin="2s" dur=".4s" fill="freeze"/></text>
        <text x="34" y="218" opacity="0">📍 Hyderabad, Telangana
          <animate attributeName="opacity" to="1" begin="2.25s" dur=".4s" fill="freeze"/></text>
        <text x="34" y="242" opacity="0">🎯 Focus: Python · Django · FastAPI
          <animate attributeName="opacity" to="1" begin="2.5s" dur=".4s" fill="freeze"/></text>
        <text x="34" y="266" opacity="0">🧩 APIs · SQL · MySQL · Git · Postman
          <animate attributeName="opacity" to="1" begin="2.75s" dur=".4s" fill="freeze"/></text>
      </g>

      <!-- familiar with -->
      <text x="34" y="304" font-size="14" fill="#F8FAFC" opacity="0">
        Familiar With
        <animate attributeName="opacity" to="1" begin="3.1s" dur=".4s" fill="freeze"/>
      </text>
      <text x="34" y="328" font-size="12.7" fill="#94A3B8" opacity="0">
        Generative AI · LangChain · Ollama · Prompt Engineering
        <animate attributeName="opacity" to="1" begin="3.3s" dur=".4s" fill="freeze"/>
      </text>
      <text x="34" y="350" font-size="12.7" fill="#94A3B8" opacity="0">

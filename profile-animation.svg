<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="6s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-200 0;200 0;-200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#2563EB;#06B6D4" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#2563EB" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="glowSmall">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="canvasClip">
      <rect x="0" y="0" width="1180" height="610" rx="26"/>
    </clipPath>

    <mask id="scanMask">
      <rect x="0" y="0" width="1180" height="610" fill="white"/>
    </mask>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1180" height="610" fill="url(#bgGrad)"/>

    <!-- floating background glows -->
    <circle cx="160" cy="120" r="220" fill="url(#glowPurple)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;20 30;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="480" r="240" fill="url(#glowCyan)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-25 -15;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="80" r="180" fill="url(#glowEmerald)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;15 20;0 0" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- tiny floating particles -->
    <g fill="#06B6D4" opacity="0.5">
      <circle cx="120" cy="500" r="2"><animate attributeName="cy" values="500;460;500" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="550" r="1.6"><animate attributeName="cy" values="550;510;550" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="1000" cy="120" r="1.8"><animate attributeName="cy" values="120;90;120" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="300" r="2"><animate attributeName="cy" values="300;260;300" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="60" r="1.5"><animate attributeName="cy" values="60;30;60" dur="5.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- border shimmer -->
    <rect x="4" y="4" width="1172" height="602" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="1.4" opacity="0.55"/>

    <!-- scanline sweep -->
    <rect x="0" y="0" width="1180" height="4" fill="#06B6D4" opacity="0.08">
      <animate attributeName="y" values="0;606;0" dur="10s" repeatCount="indefinite"/>
    </rect>


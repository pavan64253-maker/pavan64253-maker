    <text x="76" y="230"><tspan class="var">languages</tspan> = [<tspan class="str">"Python"</tspan>, <tspan class="str">"JavaScript"</tspan>]</text>
    <text x="76" y="254"><tspan class="var">llm</tspan> = [<tspan class="str">"Gemini"</tspan>, <tspan class="str">"LangChain"</tspan>, <tspan class="str">"Ollama"</tspan>]</text>

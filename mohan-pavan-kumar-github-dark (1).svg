    <text x="76" y="314"><tspan class="kw">def</tspan> <tspan class="cls">builds</tspan>(<tspan class="var">self</tspan>):</text>
    <text x="100" y="338"><tspan class="kw">return</tspan> <tspan class="str">"AI automations"</tspan></text>

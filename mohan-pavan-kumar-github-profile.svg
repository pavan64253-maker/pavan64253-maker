<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color"
                 values="#10B981;#2563EB;#06B6D4;#10B981"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform"
                        type="translate"
                        values="-250 0;250 0;-250 0"
                        dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color"
                 values="#06B6D4;#2563EB;#06B6D4"
                 dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".10"/>
    </filter>

    <clipPath id="clip">
      <rect width="1180" height="610" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1180" height="610" fill="url(#bg)"/>

    <!-- Ambient animated glows -->
    <circle cx="140" cy="90" r="210" fill="url(#glow1)" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;25 25;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="500" r="250" fill="url(#glow2)" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;-25 -15;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating particles -->
    <g fill="#06B6D4" opacity=".55">
      <circle cx="100" cy="500" r="2">
        <animate attributeName="cy" values="500;455;500" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="550" r="1.5">
        <animate attributeName="cy" values="550;510;550" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="110" r="1.8">
        <animate attributeName="cy" values="110;80;110" dur="4.5s" repeatCount="indefinite"/>
